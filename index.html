<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenSee</title>
  <link rel="icon" href="/assets/ico.png" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0a0806;
      --ink: #e8e4dc;
      --ink-light: rgba(255,255,255,0.55);
      --accent: #d8b07a;
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      width: 100vw;
      height: 100vh;
      background: url('/assets/opensee-hero.jpg') center / cover no-repeat;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.45);
      pointer-events: none;
      z-index: 0;
    }

    .logo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Cormorant Garamond', 'Times New Roman', serif;
      font-size: clamp(2.5rem, 7vw, 4rem);
      font-weight: 300;
      letter-spacing: 0.04em;
      color: rgba(255,255,255,0.2);
      pointer-events: none;
      z-index: 1;
    }

    .aura-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 1;
    }

    .aura {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      will-change: transform, opacity;
    }

    .ripple {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      animation: rippleOut 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      z-index: 10;
    }

    @keyframes rippleOut {
      0%   { transform: translate(-50%,-50%) scale(0); opacity: 0.7; }
      100% { transform: translate(-50%,-50%) scale(5); opacity: 0; }
    }

    .hint {
      position: absolute;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      font-weight: 300;
      letter-spacing: 0.25em;
      color: var(--ink-light);
      pointer-events: none;
      z-index: 10;
    }

    @media (max-width: 768px) {
      .logo { font-size: clamp(2rem, 9vw, 3rem); }
      .hint { bottom: 28px; font-size: 11px; }
    }
  </style>
</head>
<body>

  <div class="logo">OpenSee.me</div>
  <div class="aura-layer" id="auraLayer"></div>
  <div class="hint">任意位置触碰感应</div>

  <script type="module" src="/ui/index.js"></script>

</body>
</html>
