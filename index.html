<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenSee</title>
  <link rel="icon" href="/assets/ico.png" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0a0806;
      --ink: #e8e4dc;
      --ink-light: rgba(255,255,255,0.55);
      --accent: #d8b07a;
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      width: 100vw;
      height: 100vh;
      background: url('/assets/opensee-hero.jpg') center / cover no-repeat;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.45);
      pointer-events: none;
      z-index: 0;
    }

    .logo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Cormorant Garamond', 'Times New Roman', serif;
      font-size: clamp(2.5rem, 7vw, 4rem);
      font-weight: 300;
      letter-spacing: 0.04em;
      color: rgba(255,255,255,0.2);
      pointer-events: none;
      z-index: 1;
    }

    .aura-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 1;
    }

    .aura {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      will-change: transform, opacity;
    }

    .ripple {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      animation: rippleOut 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      z-index: 10;
    }

    @keyframes rippleOut {
      0%   { transform: translate(-50%,-50%) scale(0); opacity: 0.7; }
      100% { transform: translate(-50%,-50%) scale(5); opacity: 0; }
    }

    /* ---- S2 提示句 ---- */
    .s2-prompt {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }

    .s2-sentence {
      font-size: 15px;
      font-weight: 300;
      letter-spacing: 0.18em;
      color: var(--accent);
      opacity: 0.85;
      transition: opacity 0.4s ease, transform 0.35s ease;
      white-space: nowrap;
    }

    .s2-prompt:hover .s2-sentence {
      opacity: 1;
      transform: translateY(-1px);
    }

    .s2-tap-hint {
      margin-top: 6px;
      font-size: 10px;
      letter-spacing: 0.22em;
      color: rgba(255,255,255,0.22);
      transition: color 0.3s;
    }

    .s2-prompt:hover .s2-tap-hint {
      color: rgba(255,255,255,0.38);
    }

    /* 切换时淡出淡入 */
    .s2-sentence.switching {
      opacity: 0;
      transform: translateY(4px);
    }

    .hint {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.28em;
      color: rgba(255,255,255,0.2);
      pointer-events: none;
      z-index: 10;
      white-space: nowrap;
    }

    @media (max-width: 768px) {
      .logo { font-size: clamp(2rem, 9vw, 3rem); }
      .s2-prompt { bottom: 72px; }
      .s2-sentence { font-size: 14px; }
      .hint { bottom: 24px; font-size: 10px; }
    }
  </style>
</head>
<body>

  <div class="logo">OpenSee.me</div>

  <!-- S2 场域提示句：点击循环切换 -->
  <div class="s2-prompt" id="s2Prompt">
    <div class="s2-sentence" id="s2Sentence">此刻，我需要做一个决定</div>
    <div class="s2-tap-hint">轻触切换</div>
  </div>

  <div class="aura-layer" id="auraLayer"></div>
  <div class="hint">任意位置触碰感应</div>

  <script type="module" src="/ui/index.js"></script>

</body>
</html>
