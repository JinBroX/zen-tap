<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>映照 · OpenSee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@200;300;400;500&family=Noto+Serif+SC:wght@200;300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/content.css">
</head>
<body>

  <!-- Particle canvas -->
  <canvas id="particleCanvas"></canvas>

  <!-- Floating light layer -->
  <div class="flow"></div>

  <!-- Result -->
  <div id="result">

    <!-- Nav -->
    <nav class="nav" id="nav">
      <a class="nav-logo" href="/">
        <img src="/logo.png" alt="OpenSee">
        <span class="nav-logo-text">OpenSee</span>
      </a>
      <span class="nav-s2-label" id="navS2Label">决策</span>
      <span class="nav-slogan">所见，即所在</span>
    </nav>
    <div class="nav-divider" id="navDivider"></div>

    <!-- Page Slider: 全屏翻页 -->
    <div class="page-slider" id="pageSlider">

      <!-- Page 0: 诗化总结 -->
      <div class="page page-hero" data-page="0">
        <div class="hero-text" id="txtSummary"></div>
      </div>

      <!-- Page 1: 外局 -->
      <div class="page page-card" data-page="1">
        <div class="card">
          <div class="card-label">外 局</div>
          <div class="card-text" id="txtLandscape"></div>
        </div>
      </div>

      <!-- Page 2: 内观 -->
      <div class="page page-card" data-page="2">
        <div class="card">
          <div class="card-label">内 观</div>
          <div class="card-text" id="txtInner"></div>
        </div>
      </div>

      <!-- Page 3: 枢机 -->
      <div class="page page-card" data-page="3">
        <div class="card">
          <div class="card-label">枢 机</div>
          <div class="card-text" id="txtPivot"></div>
        </div>
      </div>

      <!-- Page 4: 趋向 -->
      <div class="page page-card" data-page="4">
        <div class="card">
          <div class="card-label">趋 向</div>
          <div class="card-text" id="txtEvolution"></div>
        </div>
      </div>

      <!-- Page 5: 结尾 -->
      <div class="page page-footer" data-page="5">
        <div class="footer-text">回到当下</div>
        <a class="footer-link" href="/">重新观察</a>
      </div>

    </div>

    <!-- Page Indicator -->
    <div class="page-indicator" id="pageIndicator">
      <div class="dot active" data-page="0"></div>
      <div class="dot" data-page="1"></div>
      <div class="dot" data-page="2"></div>
      <div class="dot" data-page="3"></div>
      <div class="dot" data-page="4"></div>
      <div class="dot" data-page="5"></div>
    </div>

    <!-- Scroll Hint -->
    <div class="scroll-hint" id="scrollHint">
      <div class="scroll-hint-arrow"></div>
      <div class="scroll-hint-text">上 滑</div>
    </div>

  </div>

  <script type="module" src="/ui/content.js"></script>

</body>
</html>
