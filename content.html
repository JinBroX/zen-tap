<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>映照 · OpenSee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@200;300;400;500&family=Noto+Serif+SC:wght@200;300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/content.css">
</head>
<body>

  <!-- Particle canvas -->
  <canvas id="particleCanvas"></canvas>

  <!-- Floating light layer -->
  <div class="flow"></div>

  <!-- Result -->
  <div id="result">

    <!-- Nav -->
    <nav class="nav" id="nav">
      <a class="nav-logo" href="/">
        <img src="/logo.png" alt="OpenSee">
        <span class="nav-logo-text">OpenSee</span>
      </a>
      <span class="nav-s2-label" id="navS2Label"></span>
      <span class="nav-slogan">所见，即所在</span>
    </nav>
    <div class="nav-divider" id="navDivider"></div>

    <!-- Scroll Content -->
    <div class="scroll" id="scroll">

      <!-- Section 1: 诗化总结 -->
      <section class="seg seg-summary" id="segSummary">
        <div class="seg-body" id="txtSummary"></div>
      </section>

      <!-- Section 2: 局势 -->
      <section class="seg" id="segSituation">
        <div class="seg-label">局势</div>
        <div class="seg-body" id="txtSituation"></div>
      </section>

      <!-- Section 3: 变化 -->
      <section class="seg" id="segMovement">
        <div class="seg-label">变化</div>
        <div class="seg-body" id="txtMovement"></div>
      </section>

      <!-- Section 4: 时机 -->
      <section class="seg" id="segTiming">
        <div class="seg-label">时机</div>
        <div class="seg-body" id="txtTiming"></div>
      </section>

      <!-- Section 5: 注意 -->
      <section class="seg" id="segRisk">
        <div class="seg-label">注意</div>
        <div class="seg-body" id="txtRisk"></div>
      </section>

      <!-- Section 6: 波动 (仅动爻时显示) -->
      <section class="seg" id="segWave" style="display:none">
        <div class="seg-label">波动</div>
        <div class="seg-body" id="txtWave"></div>
      </section>

      <!-- Section 7: 走向 -->
      <section class="seg" id="segOutcome">
        <div class="seg-label">走向</div>
        <div class="seg-body" id="txtOutcome"></div>
      </section>

      <!-- Section 8: 参照视角 -->
      <section class="seg" id="segRefs" style="display:none">
        <div class="seg-label">参照</div>

        <div class="ref-card" id="refOpposite" style="display:none">
          <div class="ref-label">反面观察</div>
          <div class="ref-body" id="txtRefOpposite"></div>
        </div>

        <div class="ref-card" id="refReverse" style="display:none">
          <div class="ref-label">倒转观察</div>
          <div class="ref-body" id="txtRefReverse"></div>
        </div>

        <div class="ref-card" id="refMutual" style="display:none">
          <div class="ref-label">内在结构</div>
          <div class="ref-body" id="txtRefMutual"></div>
        </div>

        <div class="ref-card" id="refChanged" style="display:none">
          <div class="ref-label">变化方向</div>
          <div class="ref-body" id="txtRefChanged"></div>
        </div>
      </section>

    </div>

    <!-- Footer -->
    <div class="footer">
      <a href="/">重新观察</a>
    </div>

  </div>

  <script type="module" src="/ui/content.js"></script>

</body>
</html>
